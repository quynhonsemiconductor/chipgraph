name: spike-s3

# Spike S3 (docs/spikes/S3.md): Edalize + cocotb + Verilator/Icarus on CI Linux. Runs only
# on a push to the spike/s3 branch, never on main or pull requests.
#
# - linux: ubuntu-latest with the OSS CAD Suite release that docker/Dockerfile pins (date
#   and amd64 sha256 read from the Dockerfile) for Verilator, Icarus from apt, Python 3.13
#   and 3.14 from uv.
# - image: the same scripts inside the Dockerfile's `chipgraph-base` stage, to see what
#   the chipgraph-eda image lacks for simulation (informational, does not fail the run).

on:
  push:
    branches: [spike/s3]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install OSS CAD Suite (the release docker/Dockerfile pins)
        run: |
          set -euo pipefail
          date="$(sed -n 's/^ARG OSS_CAD_SUITE_DATE=//p' docker/Dockerfile)"
          sha256="$(sed -n 's/^ARG OSS_CAD_SUITE_SHA256_AMD64=//p' docker/Dockerfile)"
          file="oss-cad-suite-linux-x64-${date//-/}.tgz"
          url="https://github.com/YosysHQ/oss-cad-suite-build/releases/download/${date}/${file}"
          curl -fsSL -o "$RUNNER_TEMP/oss-cad-suite.tgz" "$url"
          echo "${sha256}  $RUNNER_TEMP/oss-cad-suite.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/oss-cad-suite.tgz" -C "$RUNNER_TEMP"
          rm -f "$RUNNER_TEMP/oss-cad-suite.tgz"
          echo "$RUNNER_TEMP/oss-cad-suite/bin" >> "$GITHUB_PATH"

      # g++: Verilator compiles the model; liblz4-dev/zlib1g-dev: its FST writer.
      # iverilog from apt, put before OSS CAD Suite's: the suite's `vvp` wrapper runs vvp
      # with the suite's loader, --library-path <suite>/lib and PYTHONHOME=<suite>, so it
      # loads the suite's own cocotb 2.1.0.dev0 libgpi.so instead of the venv's
      # ("undefined symbol: gpi_debug_enabled", no test runs). See docs/spikes/S3.md.
      - name: Install the C++ build deps of a Verilator model, and Icarus from apt
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ make liblz4-dev zlib1g-dev iverilog
          mkdir -p "$RUNNER_TEMP/apt-icarus"
          ln -sf /usr/bin/iverilog /usr/bin/vvp "$RUNNER_TEMP/apt-icarus/"
          echo "$RUNNER_TEMP/apt-icarus" >> "$GITHUB_PATH"

      - name: Tool versions
        run: |
          verilator --version
          iverilog -V 2>&1 | head -n 1
          g++ --version | head -n 1
          make --version | head -n 1
          which -a verilator iverilog vvp python3 cocotb-config || true

      - name: Run the S3 scripts
        env:
          S3_OUT: ${{ runner.temp }}/s3-${{ matrix.python }}
          PYTHON_VERSION: ${{ matrix.python }}
        run: |
          set -o pipefail
          docs/spikes/s3/run.sh "$S3_OUT" "$PYTHON_VERSION" only-managed 2>&1 | tee "$RUNNER_TEMP/s3-${PYTHON_VERSION}.log"
          cat "$S3_OUT/results/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spike-s3-linux-py${{ matrix.python }}
          path: |
            ${{ runner.temp }}/s3-${{ matrix.python }}.log
            ${{ runner.temp }}/s3-${{ matrix.python }}/*.txt
            ${{ runner.temp }}/s3-${{ matrix.python }}/results/summary.*
            ${{ runner.temp }}/s3-${{ matrix.python }}/results/logs
            ${{ runner.temp }}/s3-${{ matrix.python }}/results/work/*/parsed.json
            ${{ runner.temp }}/s3-${{ matrix.python }}/results/work/*/results.xml
          if-no-files-found: error
          retention-days: 14

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the chipgraph-base stage of docker/Dockerfile
        run: docker build --target chipgraph-base -t s3-chipgraph-base -f docker/Dockerfile .

      - name: Run the S3 scripts inside it, as built (no extra packages)
        env:
          S3_REPORT: ${{ runner.temp }}/s3-image
        run: |
          set -o pipefail
          mkdir -p "$S3_REPORT"
          docker run --rm -v "$PWD:/src:ro" -v "$S3_REPORT:/report" s3-chipgraph-base sh -c '
            for t in verilator iverilog vvp g++ c++ make; do
              printf "%s: %s\n" "$t" "$(command -v "$t" || echo missing)"
            done
            /src/docs/spikes/s3/run.sh /tmp/s3 3.14 only-managed
            rc=$?
            cp -r /tmp/s3/results/summary.md /tmp/s3/results/logs /report/ 2>/dev/null
            exit $rc
          ' 2>&1 | tee "$S3_REPORT/image.log"

      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spike-s3-image
          path: ${{ runner.temp }}/s3-image
          if-no-files-found: error
          retention-days: 14
