[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chipgraph"
version = "0.0.1"
description = "AI agent system for chip (IC) design, built on a build graph over a Design Model"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.27",
    "pydantic>=2.13",
    "pyyaml",
    "opentelemetry-api>=1.45",
    "mcp>=2.2,<3",
    "jinja2>=3.1",
]

[project.optional-dependencies]
otel = [
    "opentelemetry-sdk>=1.45",
    "opentelemetry-exporter-otlp-proto-http>=1.45",
]

[project.scripts]
chipgraph = "chipgraph.cli:app"

[project.entry-points."chipgraph.adapters.vcs"]
git = "chipgraph.adapters.vcs.git:GitVcs"

[project.entry-points."chipgraph.adapters.runner"]
local = "chipgraph.adapters.runner.local:LocalRunner"

[project.entry-points."chipgraph.adapters.tool"]
cmd = "chipgraph.adapters.tool.cmd:CmdTool"

[project.entry-points."chipgraph.adapters.parser"]
verilator = "chipgraph.adapters.parser.verilator:VerilatorParser"
verible = "chipgraph.adapters.parser.verible:VeribleParser"

[project.entry-points."chipgraph.adapters.check"]
layout = "chipgraph.checks.layout:LayoutCheck"
filelist = "chipgraph.checks.filelist:FilelistCheck"
generated = "chipgraph.checks.generated:GeneratedCheck"

[project.entry-points."chipgraph.adapters.review"]
file = "chipgraph.adapters.review.file:FileReview"

[dependency-groups]
dev = [
    "ruff>=0.16",
    "mypy>=2.3",
    "pytest>=9.1",
    "pre-commit",
    "types-PyYAML",
    "import-linter>=2.15",
    "opentelemetry-sdk>=1.45",
]

[tool.hatch.build.targets.wheel]
packages = ["src/chipgraph"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
mypy_path = "src"
packages = ["chipgraph"]

[[tool.mypy.overrides]]
module = "chipgraph.core.*"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: needs the EDA tools (verilator)",
]

[tool.importlinter]
root_package = "chipgraph"

[[tool.importlinter.contracts]]
name = "core knows nothing about adapters, checks or surfaces"
type = "forbidden"
source_modules = ["chipgraph.core"]
forbidden_modules = [
    "chipgraph.adapters",
    "chipgraph.checks",
    "chipgraph.cli",
    "chipgraph.app",
    "chipgraph.mcp",
]
