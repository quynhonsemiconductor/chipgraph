[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chipgraph"
version = "0.1.0rc1"
description = "AI agent system for chip (IC) design, built on a build graph over a Design Model"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.27",
    "pydantic>=2.13",
    "pyyaml",
    "opentelemetry-api>=1.45",
    "mcp>=2.2,<3",
    "jinja2>=3.1",
    "pyslang>=12,<13",
]

[project.optional-dependencies]
otel = [
    "opentelemetry-sdk>=1.45",
    "opentelemetry-exporter-otlp-proto-http>=1.45",
]
llm = [
    "anthropic>=1.9,<2",
]
evals = [
    "inspect-ai==0.3.277",
]
# Simulation (adapter `edalize`, parser `cocotb`): exact pins, since cocotb's GPI env
# contract changed between 1.x and 2.x and Edalize's cocotb glue lags it (docs/spikes/S3.md).
sim = [
    "edalize==0.6.8",
    "cocotb==2.1.0",
]

[project.scripts]
chipgraph = "chipgraph.cli:app"

[project.entry-points."chipgraph.adapters.vcs"]
git = "chipgraph.adapters.vcs.git:GitVcs"

[project.entry-points."chipgraph.adapters.runner"]
local = "chipgraph.adapters.runner.local:LocalRunner"

[project.entry-points."chipgraph.adapters.tool"]
cmd = "chipgraph.adapters.tool.cmd:CmdTool"
edalize = "chipgraph.adapters.tool.edalize:EdalizeTool"

[project.entry-points."chipgraph.adapters.parser"]
verilator = "chipgraph.adapters.parser.verilator:VerilatorParser"
verible = "chipgraph.adapters.parser.verible:VeribleParser"
cocotb = "chipgraph.adapters.parser.cocotb:CocotbParser"

[project.entry-points."chipgraph.adapters.check"]
layout = "chipgraph.checks.layout:LayoutCheck"
filelist = "chipgraph.checks.filelist:FilelistCheck"
generated = "chipgraph.checks.generated:GeneratedCheck"
naming = "chipgraph.checks.naming:NamingCheck"
spec_schema = "chipgraph.checks.spec_schema:SpecSchemaCheck"
cross_chip = "chipgraph.checks.cross_chip:CrossChipCheck"
ports_diff = "chipgraph.checks.ports_diff:PortsDiffCheck"
duplicate = "chipgraph.checks.duplicate:DuplicateCheck"
trace = "chipgraph.checks.trace:TraceCheck"
connect = "chipgraph.checks.connect:ConnectCheck"
hardcode = "chipgraph.checks.hardcode:HardcodeCheck"
cdc_struct = "chipgraph.checks.cdc_struct:CdcStructCheck"

[project.entry-points."chipgraph.adapters.llm"]
fake = "chipgraph.adapters.llm.fake:FakeProvider"
anthropic = "chipgraph.adapters.llm.anthropic:AnthropicProvider"
anthropic-compatible = "chipgraph.adapters.llm.anthropic:anthropic_compatible"

[project.entry-points."chipgraph.adapters.review"]
file = "chipgraph.adapters.review.file:FileReview"
github = "chipgraph.adapters.review.github:GitHubReview"

[project.entry-points."chipgraph.adapters.extractor"]
pyslang = "chipgraph.adapters.tool.pyslang:PyslangExtractor"
mas-markdown = "chipgraph.packs.spec_core.extract.mas:MasExtractor"

[project.entry-points."chipgraph.adapters.format"]
qsoc-contract = "chipgraph.adapters.format.qsoc_contract:QSocContractAdapter"
chip-yaml = "chipgraph.adapters.format.chip_yaml:ChipYamlAdapter"

[project.entry-points."chipgraph.adapters.generator"]
diagram = "chipgraph.packs.spec_core.gen.diagram:DiagramGenerator"

[dependency-groups]
dev = [
    "ruff>=0.16",
    "mypy>=2.3",
    "pytest>=9.1",
    "pre-commit",
    "types-PyYAML",
    "import-linter>=2.15",
    "opentelemetry-sdk>=1.45",
    "anthropic>=1.9,<2",
    "inspect-ai==0.3.277",
]

[tool.hatch.build.targets.wheel]
packages = ["src/chipgraph"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
mypy_path = "src"
packages = ["chipgraph"]

[[tool.mypy.overrides]]
module = "chipgraph.core.*"
strict = true


[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: needs the EDA tools (verilator)",
]

[tool.importlinter]
root_package = "chipgraph"

[[tool.importlinter.contracts]]
name = "core knows nothing about adapters, checks, packs or surfaces"
type = "forbidden"
source_modules = ["chipgraph.core"]
forbidden_modules = [
    "chipgraph.adapters",
    "chipgraph.checks",
    "chipgraph.cli",
    "chipgraph.app",
    "chipgraph.mcp",
    "chipgraph.packs",
]
