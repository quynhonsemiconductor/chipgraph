# chipgraph profile for QSoC, a training SoC with one `make` entry point (task M0-18).
#
# This is documentation, not a CI test: copy it to the root of a QSoC clone as
# `.chipgraph.yml`. Every check calls the `make` target developers and CI already use,
# so `chipgraph check` gives the same answer as the per-block part of `make check`,
# one line per check and block.
#
# The repository's Python checks print findings as "  <file>:<line>  [<rule>]  <msg>";
# `regex` turns those lines into issues. `make lint` indents Verilator's log under a
# per-block header, which the `verilator` parser reads.
#
# Not covered here: the repository-wide targets of `make check` (filelists, pkg-check,
# tables, wrap-check, vendor-guard). `chipgraph check` runs every adapter once per
# block, so they stay in `make check` until checks can run once per repository.
project: qsoc

packs: []

# Requirement IDs (DECISIONS D37). Seven MAS files tag each Verification item with an ID
# like `DMA_001`; the other six (TIMER, PWM, RAM, SCRC, SYSDBG, Interrupt_Map) have none
# yet, so `infer: verification` keys each of their numbered Verification items by block
# and content hash. A declared ID always wins. Drop `infer` once every MAS has IDs.
# In a MAS that has IDs, a Verification item without one is `requirement.missing_id`
# (spec_schema). Rules and checks: docs/REQUIREMENT_IDS.md in the chipgraph repository.
spec:
  chip:
    path: util/qsoc_contract.yml
    format: qsoc-contract
  requirements:
    id_pattern: '{BLOCK}_\d{3}'
    infer: verification
  # WDT wraps an OpenTitan IP whose registers use RW0C/RW1C; extend the accepted modes.
  register_access: [RW, RO, WO, W1C, RSVD, RW0C, RW1C]

# Where per-block RTL filelists and MAS specs live, so `chipgraph ingest` can build the
# Design Model (M1-06). `{block}` is the directory name; `{BLOCK}` its upper-case form.
layout:
  filelist: "design/{block}/{block}.f"
  spec: "doc/specs/QNSC_{BLOCK}_MAS.md"

adapters:
  lint:
    use: cmd
    cmd: "make lint BLOCK={block}"
    parser: verilator
  naming:
    use: cmd
    cmd: "make naming BLOCK={block}"
    regex: '^\s+(?P<file>\S+):(?P<line>\d+)\s+\[(?P<rule>[^\]]+)\]\s+(?P<msg>.+)$'
  hardcode:
    use: cmd
    cmd: "make hardcode BLOCK={block}"
    regex: '^\s+(?P<file>\S+):(?P<line>\d+)\s+\[(?P<rule>[^\]]+)\]\s+(?P<msg>.+)$'
  module_rules:
    use: cmd
    cmd: "make module-rules BLOCK={block}"
    regex: '^\s+(?P<file>\S+):(?P<line>\d+)\s+\[(?P<rule>[^\]]+)\]\s+(?P<msg>.+)$'
  contract_tags:
    use: cmd
    cmd: "make contract-tags BLOCK={block}"
    regex: '^\s+(?P<file>\S+):(?P<line>\d+)\s+\[(?P<rule>[^\]]+)\]\s+(?P<msg>.+)$'

  # Cross checks over the Design Model (M1-07). Run `chipgraph ingest` first.
  spec_schema: { use: spec_schema }
  cross_chip: { use: cross_chip }
  ports_diff: { use: ports_diff, top: "m_qnsc_wrap_{block}" }
  duplicate: { use: duplicate, scope: ["design/**/*.sv", "design/**/*.v"] }
  # QSoC has no DV tests yet: report untraced requirements, but do not block, until DV
  # starts (then drop `severity`).
  trace: { use: trace, tests: ["design/*/dv/**/*", "dv/**/*"], severity: warning }
  connect: { use: connect }
  hardcode:
    use: hardcode
    scope: ["design/**/rtl/**/*.sv"]
    generated: ["design/top/rtl/qnsc_pkg.sv"]  # generated from the contract
  # Structural CDC (M1-19): a signal crossing between two clock domains must go through a
  # declared synchroniser. `qnsc_sync` is QSoC's own two-flop level synchroniser
  # (design/common/rtl/qnsc_sync.sv, "every such crossing in QSOC goes through this
  # cell"); the `prim_*_sync` cells are the vendored OpenTitan synchronisers CPU/CDC paths
  # use. Only cells that exist in the tree are listed.
  cdc_struct:
    use: cdc_struct
    sync_cells:
      - qnsc_sync
      - prim_flop_2sync
      - prim_pulse_sync
      - prim_multibit_sync
      - prim_lc_sync
      - prim_sync_reqack
      - prim_fifo_async

# One entry per directory under design/ that has a <block>.f filelist, plus syscsr, whose
# design directory is still in an open PR (ingest warns about its missing filelist until
# then). A block whose spec file is not QNSC_<BLOCK>_MAS.md maps it with its own
# `layout.spec`; a list reads several files, and `[]` would say it has none.
#
# Each block is an IP (D38). The chip contract's memory map names instances, not IPs;
# `instances:` lists an IP's instances so ingest links `block:<instance>` -> `block:<ip>`
# with `instance_of`. Blocks with no `instances:` match a same-named instance in the
# contract. `dma_cfg` and `isram_dbg` still need the owner's confirmation.
blocks:
  bus: {}
  common: {}
  cpu: {}
  dma:
    instances: [dma_cfg]  # dma_cfg needs the owner's confirmation
  dsram:
    # ISRAM and DSRAM are "two blocks with one design" (QNSC_RAM_MAS.md 1). The shared
    # spec is read once, under isram, so its requirements are not counted twice.
    layout: { spec: [] }
  gpio:
    instances: [gpio_0, gpio_1, gpio_2]
  i2c: {}
  intmap:
    layout: { spec: "doc/specs/QNSC_Interrupt_Map_MAS.md" }
  iomux: {}
  isram:
    layout: { spec: "doc/specs/QNSC_RAM_MAS.md" }  # also dsram's spec, read once here
    instances: [isram, isram_dbg]  # isram_dbg needs the owner's confirmation
  pwm: {}
  rom:
    # The bootloader in ROM has its own spec, whose ids are BOOT_NNN, not ROM_NNN.
    layout: { spec: ["doc/specs/QNSC_ROM_MAS.md", "doc/specs/QNSC_BOOT_SPEC.md"] }
    spec:
      requirements: { id_pattern: '(?:ROM|BOOT)_\d{3}' }
  scrc: {}
  spi:
    # The contract names spi's two interrupts by peripheral (D38).
    instances: [spi, spi_device, spi_host]
  syscsr: {}
  sysdbg: {}
  timer:
    instances: [timer_0, timer_1]
  top: {}
  uart:
    instances: [uart_0, uart_1]
  wdt:
    instances: [wdt, wdt_wakeup]  # the wakeup interrupt, named by peripheral

# The MAS template matches the spec pattern but is not a block's spec.
paths:
  "doc/specs/QNSC_TEMPLATE_MAS.md":
    checks: { ingest: off }
    reason: "the team's MAS template, not the spec of a block"
