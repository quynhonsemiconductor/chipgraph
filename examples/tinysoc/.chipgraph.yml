# chipgraph project profile for the tinysoc example (see DESIGN.md 8.3-8.6).
project: tinysoc

packs:
  - tinysoc

# The chip-level spec and where per-block RTL and MAS specs live, so `chipgraph ingest`
# can build the Design Model (M1-06). Only `timer` and `gpio` have a MAS.
spec:
  chip:
    path: chip.yml
    format: chip-yaml

layout:
  filelist: "filelists/{block}.f"
  spec: "doc/specs/TINY_{BLOCK}_MAS.md"
  # The testbenches and tests. A role that must not see them (the RTL author, M2-04) is
  # refused these paths, on top of every file named like a test (`test_*.py`, `tb_*`).
  tb: "dv/**"

# The style an RTL author imitates and the `style` check measures (M2-04), and the
# formatter the `format` check runs on generated RTL before the other checks: none is
# set, so `verible-verilog-format --inplace` when it is on PATH, else `format` is skipped.
style:
  exemplars: [rtl/tiny_timer.sv, rtl/tiny_gpio.sv]

adapters:
  lint:
    use: cmd
    cmd: "make lint BLOCK={block}"
    parser: verilator
  spec_schema: { use: spec_schema }
  cross_chip: { use: cross_chip }
  ports_diff: { use: ports_diff, top: "tiny_{block}" }
  duplicate: { use: duplicate }
  # Cross checks (M1-07 part B). tinysoc passes all three: every declared REQ-ID is named
  # by a dv stub (trace), both blocks are instantiated in the top with their irq wired
  # (connect), and its addresses (0x0/0x4) are below `hardcode`'s default min_value so no
  # RTL literal duplicates a contract number.
  trace:
    use: trace
    tests: ["dv/**/*.py", "dv/**/*.sv"]
  connect:
    use: connect
  hardcode:
    use: hardcode
    scope: ["rtl/**/*.sv"]
  # Structural CDC (M1-19). tinysoc has a single clock (`clk`), so no signal crosses a
  # domain and this passes on every block. `sync_cells` is still required, so name a cell
  # the design would use if it grew a second clock; none exists yet, so none is analysed.
  cdc_struct:
    use: cdc_struct
    sync_cells: [tiny_sync2]
  # The checks of `digital-rtl/rtl_module` (M2-04), in its order: format, lint (above),
  # naming, style, hardcode (above). `format` and `style` work on an agent task's
  # outputs only, so `chipgraph check` reports them skipped.
  format: { use: format }
  naming:
    use: naming
    rules: .chipgraph/naming.yml
    scope: ["rtl/**/*.sv"]
  style: { use: style }
  # The wrapper of the vendored FIFO (M2-12): `wrap_check` regenerates it with emacs and
  # compares (without emacs it checks the generated file's marker and source hash), and
  # `vendor_guard` fails when a file under vendor/ differs from vendor/MANIFEST.sha256.
  wrap_check: { use: wrap_check }
  vendor_guard: { use: vendor_guard }

blocks:
  timer: {}
  gpio: {}
  # The top has no MAS of its own: say so, so ingest does not report it missing.
  top:
    layout: { spec: [] }
    # A wrapper around a third-party IP (vendor/vendor_fifo), written as
    # rtl/emacs/tiny_fifo_wrap.src.sv and expanded to rtl/tiny_fifo_wrap.sv
    # (`digital-rtl/wrapper`, `digital-rtl/wrapper_gen`).
    wrappers:
      - name: tiny_fifo_wrap
        vendor_module: vendor_fifo
        vendor_files: [vendor/vendor_fifo/vendor_fifo.sv]
