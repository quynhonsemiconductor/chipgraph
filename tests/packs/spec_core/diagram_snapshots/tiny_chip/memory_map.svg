<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="560" height="208" viewBox="0 0 560 208" font-family="sans-serif" font-size="12">
  <title>Memory map</title>
  <desc>Memory map: 2 region(s).</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#000000"/></marker></defs>
  <rect x="20" y="20" width="520" height="44" fill="#ffffff" stroke="#000000"/>
  <text x="280" y="36" text-anchor="middle">Memory map (base / end / size / block)</text>
  <rect x="20" y="76" width="520" height="44" fill="#ffffff" stroke="#000000"/>
  <text x="280" y="92" text-anchor="middle">timer</text>
  <text x="280" y="108" text-anchor="middle">0x00000000 .. 0x00001000  size 0x00001000  block timer</text>
  <rect x="20" y="132" width="520" height="44" fill="#ffffff" stroke="#000000"/>
  <text x="280" y="148" text-anchor="middle">gpio</text>
  <text x="280" y="164" text-anchor="middle">0x00001000 .. 0x00002000  size 0x00001000  block gpio</text>
